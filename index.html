<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="今天吃什么？一个帮你随机决定吃什么的小工具，再也不用纠结。">
  <meta name="author" content="WANG Youlin">
  <title>今天吃什么？What to Eat — 随机选择器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0552c'/%3E%3Cpath d='M7 17h18a9 9 0 0 1-18 0z' fill='white'/%3E%3Cpath d='M12 9c-1 1.5-1 3 0 4M17 8c-1 1.5-1 3 0 4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <style>
    /* ===== Variables & reset ===== */
    :root {
      --primary: #e0552c;
      --primary-dark: #c2411f;
      --accent: #f59e0b;
      --bg: #fdf6ef;
      --card: #ffffff;
      --ink: #3a2a20;
      --muted: #8a7364;
      --line: #f0e2d4;
      --shadow: 0 6px 22px rgba(194, 65, 31, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.7; font-size: 16px;
    }
    a { color: var(--primary); text-decoration: none; }
    h1, h2, h3 { line-height: 1.3; font-weight: 700; }
    .wrap { width: 100%; max-width: 860px; margin: 0 auto; padding: 0 20px; }

    /* ===== Header ===== */
    header.site { background: var(--card); border-bottom: 1px solid var(--line); }
    .nav-bar { display: flex; align-items: center; gap: 10px; min-height: 64px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight:700; font-size: 18px; color: var(--ink); }
    .logo-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: grid; place-items: center; }
    .logo .en { color: var(--muted); font-weight: 500; font-size: 14px; }

    /* ===== Hero / picker ===== */
    .picker { padding: 48px 0 20px; text-align: center; }
    .picker h1 { font-size: 34px; margin-bottom: 8px; }
    .picker h1 .en { color: var(--primary); }
    .picker .lead { color: var(--muted); margin-bottom: 30px; }
    .result-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow); padding: 44px 24px; max-width: 520px; margin: 0 auto 26px;
    }
    .result-label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
    #result {
      font-size: 46px; font-weight: 800; color: var(--primary-dark); min-height: 60px;
      display: grid; place-items: center; transition: transform 0.12s;
    }
    #result.rolling { transform: scale(1.06); color: var(--accent); }
    #result.picked { animation: pop 0.4s ease; }
    @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 34px; border-radius: 999px; border: none; cursor: pointer;
      font-size: 17px; font-weight: 700; font-family: inherit; transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(224,85,44,0.3); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost { background: #fbeee4; color: var(--primary-dark); padding: 10px 18px; font-size: 14px; }
    .btn-ghost:hover { background: #f6e0d0; }

    /* ===== Options manager ===== */
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow); padding: 30px; margin: 14px 0 20px;
    }
    .panel h2 { font-size: 21px; margin-bottom: 4px; }
    .panel .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 20px; }
    .add-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
    .add-row input {
      flex: 1 1 200px; min-width: 0; padding: 13px 16px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 16px; font-family: inherit; background: #fffaf5;
    }
    .add-row input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); background:#fff; }
    .add-row .btn { border-radius: 10px; padding: 13px 24px; }
    #option-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      display: inline-flex; align-items: center; gap: 8px; background: #fff4ec;
      border: 1px solid var(--line); color: var(--ink); padding: 8px 10px 8px 14px;
      border-radius: 999px; font-size: 15px; font-weight: 600;
    }
    .tag button {
      width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
      background: #f3d9c9; color: var(--primary-dark); display: grid; place-items: center;
      font-size: 14px; line-height: 1; padding: 0;
    }
    .tag button:hover { background: var(--primary); color: #fff; }
    .empty-hint { color: var(--muted); font-size: 14.5px; }

    /* ===== How to use ===== */
    .how { padding: 26px 0 40px; }
    .how h2 { font-size: 21px; margin-bottom: 18px; text-align: center; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; text-align: center; }
    .step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color:#fff; font-weight: 800; display: grid; place-items: center; margin: 0 auto 12px; }
    .step p { font-size: 14.5px; color: var(--muted); }
    .step strong { display: block; margin-bottom: 4px; color: var(--ink); }

    /* ===== Footer ===== */
    footer.site { background: var(--ink); color: #d8c8bb; padding: 30px 0; font-size: 14px; }
    footer .foot-inner { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    footer a { color: #f3e6db; }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .picker h1 { font-size: 27px; }
      #result { font-size: 38px; }
      .steps { grid-template-columns: 1fr; }
      .result-card { padding: 34px 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site">
    <div class="wrap nav-bar">
      <div class="logo">
        <span class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M7 17h18a9 9 0 0 1-18 0z" fill="#fff"/>
            <path d="M12 9c-1 1.5-1 3 0 4M17 8c-1 1.5-1 3 0 4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        今天吃什么 <span class="en">What to Eat?</span>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== Picker ===== -->
    <section class="picker">
      <div class="wrap">
        <h1>纠结吃啥？<span class="en">让我帮你选！</span></h1>
        <p class="lead">把你想吃的都加进来，点一下按钮，随机帮你决定今天这顿。</p>
        <div class="result-card">
          <div class="result-label">今日推荐</div>
          <div id="result">点击下方按钮</div>
        </div>
        <button class="btn btn-primary" id="pick-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="8" width="18" height="12" rx="3" stroke="#fff" stroke-width="2"/>
            <path d="M8 8V6a4 4 0 0 1 8 0v2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          </svg>
          帮我选一个
        </button>
      </div>
    </section>

    <!-- ===== Options ===== -->
    <section class="wrap">
      <div class="panel">
        <h2>我的菜单</h2>
        <p class="sub">添加或删除候选美食，你的菜单会自动保存在这个浏览器里。</p>
        <div class="add-row">
          <input type="text" id="new-option" placeholder="输入一个美食，比如：火锅" maxlength="12">
          <button class="btn btn-primary" id="add-btn" type="button">添加</button>
        </div>
        <div id="option-tags"></div>
      </div>
    </section>

    <!-- ===== How to use ===== -->
    <section class="how wrap">
      <h2>三步就能用</h2>
      <div class="steps">
        <div class="step">
          <span class="n">1</span>
          <strong>添加选项</strong>
          <p>把你想吃的菜输进来，也可以直接用默认菜单。</p>
        </div>
        <div class="step">
          <span class="n">2</span>
          <strong>点击按钮</strong>
          <p>按一下"帮我选一个"，画面会快速滚动。</p>
        </div>
        <div class="step">
          <span class="n">3</span>
          <strong>开吃</strong>
          <p>停下的那个就是今天的答案，不用再纠结啦。</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="site">
    <div class="wrap foot-inner">
      <div>今天吃什么 · What to Eat?</div>
      <div>&copy; 2026 WANG Youlin · 纯 HTML / CSS / JavaScript 手写</div>
    </div>
  </footer>

  <script>
    // ===== 数据：默认菜单 + 本地存储 =====
    const DEFAULT_OPTIONS = ["火锅", "麻辣烫", "黄焖鸡米饭", "兰州拉面", "蛋炒饭", "烧烤", "饺子", "螺蛳粉"];
    const STORAGE_KEY = "what-to-eat-options";
    let options = [];
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      options = Array.isArray(saved) && saved.length ? saved : DEFAULT_OPTIONS.slice();
    } catch (e) {
      options = DEFAULT_OPTIONS.slice();
    }

    const tagsBox = document.getElementById("option-tags");
    const resultEl = document.getElementById("result");
    const pickBtn = document.getElementById("pick-btn");
    const newInput = document.getElementById("new-option");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(options));
    }

    // ===== 渲染选项标签 =====
    function render() {
      tagsBox.innerHTML = "";
      if (!options.length) {
        const p = document.createElement("p");
        p.className = "empty-hint";
        p.textContent = "菜单空了，先添加一个想吃的吧。";
        tagsBox.appendChild(p);
        return;
      }
      options.forEach(function (name) {
        const tag = document.createElement("span");
        tag.className = "tag";
        const label = document.createElement("span");
        label.textContent = name;
        const del = document.createElement("button");
        del.type = "button";
        del.setAttribute("aria-label", "删除 " + name);
        del.textContent = "×";
        del.addEventListener("click", function () {
          options = options.filter(function (x) { return x !== name; });
          save();
          render();
        });
        tag.appendChild(label);
        tag.appendChild(del);
        tagsBox.appendChild(tag);
      });
    }

    // ===== 添加选项 =====
    function addOption() {
      const value = newInput.value.trim();
      if (!value) { newInput.focus(); return; }
      if (options.indexOf(value) !== -1) {
        resultEl.textContent = "菜单里已经有「" + value + "」啦";
        resultEl.className = "";
        newInput.value = "";
        return;
      }
      options.push(value);
      save();
      render();
      newInput.value = "";
      newInput.focus();
    }
    document.getElementById("add-btn").addEventListener("click", addOption);
    newInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addOption();
    });

    // ===== 随机选择（带滚动动画） =====
    let rolling = false;
    pickBtn.addEventListener("click", function () {
      if (rolling) return;
      if (!options.length) {
        resultEl.textContent = "先添加选项哦";
        resultEl.className = "";
        return;
      }
      rolling = true;
      pickBtn.disabled = true;
      resultEl.classList.add("rolling");
      resultEl.classList.remove("picked");
      let ticks = 0;
      const totalTicks = 14;
      const timer = setInterval(function () {
        resultEl.textContent = options[Math.floor(Math.random() * options.length)];
        ticks++;
        if (ticks >= totalTicks) {
          clearInterval(timer);
          const final = options[Math.floor(Math.random() * options.length)];
          resultEl.textContent = final;
          resultEl.classList.remove("rolling");
          resultEl.classList.add("picked");
          rolling = false;
          pickBtn.disabled = false;
        }
      }, 90);
    });

    render();
  </script>
</body>
</html>
